version: '3'

vars:
  # Minimum supported Go version. Keep in sync with the `go` directive in
  # go.mod and the lowest entry of the CI matrix in .github/workflows/ci.yml.
  # `task ci` pins the toolchain to this version so a dependency that quietly
  # raises the floor fails locally instead of only in CI.
  GO_MIN: '1.26.0'

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  test:
    desc: "Run unit tests via gotestsum"
    cmds:
      - gotestsum -- ./...

  test:integration:
    desc: "Run unit + integration tests (requires Docker)"
    cmds:
      - gotestsum -- -tags=integration ./...

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  format:
    desc: "Format Go code with golangci-lint v2's built-in formatters"
    cmds:
      - golangci-lint fmt ./...

  tidy:
    desc: "Run go mod tidy"
    cmds:
      - go mod tidy

  tidy:check:
    desc: "Fail if go.mod/go.sum are not tidy"
    cmds:
      - go mod tidy
      - git diff --exit-code go.mod go.sum

  ci:
    desc: "Full pre-push gate: mirrors GitHub Actions on the minimum supported Go"
    env:
      # Pin the build/test toolchain to the floor. A dependency that requires a
      # newer Go than GO_MIN fails here, the way the matrix's lowest job would.
      GOTOOLCHAIN: 'go{{.GO_MIN}}'
    cmds:
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - golangci-lint run ./...
      - go build ./...
      - gotestsum -- ./...
      - gotestsum -- -tags=integration ./...

  changelog:
    desc: "Regenerate CHANGELOG.md from git history"
    cmds:
      - git cliff -o CHANGELOG.md

  changelog:unreleased:
    desc: "Preview the next release's changelog section"
    cmds:
      - git cliff --unreleased
